name: 每日監控

# 平常完全靜默,只在需要你動手時開 Issue(手機會收到通知)。
#
# 涵蓋:風險旗標翻轉、Worker 斷線、資料過期、上游格式破損、
#       00653L 扳機翻轉、Worker 判斷與本地重算不一致。
#
# 不涵蓋(需要持倉,留在 PWA 本機算):權重漂移超帶、分層觸發。
# 這個 repo 是公開的,Issue 也是公開的,持倉金額絕不放進來。

on:
  schedule:
    # 08:00 UTC = 台北 16:00,台股收盤後。台灣無日光節約時間。
    - cron: "0 8 * * 1-5"
  workflow_dispatch:        # 可手動觸發
    inputs:
      drill:
        description: "演練:強制發一則測試通知,確認手機收得到(不影響心跳)"
        type: boolean
        default: false

# 併發保護:排程與手動同時觸發時,不要兩份一起改 heartbeat
concurrency:
  group: daily-monitor
  cancel-in-progress: false

permissions:
  contents: write           # 提交 heartbeat
  issues: write             # 開通知 Issue

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v4 的 runtime 是已棄用的 Node 20,GitHub 已強制改跑 Node 24。
      # 這是要無人值守跑數年的排程,不能留著遲早會停的相依。
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 引擎自我驗證
        # 監控用的是同一套引擎,引擎壞了就不該相信它的判斷。
        # 但「測試失敗就整個中止」會讓你連市場警報一起失去——
        # 失敗必須自己變成一則通知,不能只是靜靜地讓 job 紅掉。
        id: selftest
        continue-on-error: true
        run: node test/run.js 2>&1 | tee /tmp/selftest.log

      - name: 引擎測試失敗 → 通知並中止
        if: steps.selftest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## ⛔ 引擎測試失敗,每日監控已暫停"
            echo ""
            echo "共用引擎的離線測試未通過,本次**沒有執行市場檢查**。"
            echo "在修復前你不會收到風險旗標翻轉等通知,請勿依配置台的建議操作。"
            echo ""
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' /tmp/selftest.log | tail -60
            echo '```'
            echo ""
            echo "重跑:\`node test/run.js\`"
          } > /tmp/selftest-issue.md
          TITLE="引擎測試失敗,監控暫停"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/selftest-issue.md
          else
            gh issue create --title "[$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')] $TITLE" \
              --body-file /tmp/selftest-issue.md --label 監控 || \
            gh issue create --title "[$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')] $TITLE" \
              --body-file /tmp/selftest-issue.md
          fi
          exit 1

      - name: 資料契約檢查
        # 需連網,上游抖動不該讓監控中止——失敗轉為通知
        id: contract
        continue-on-error: true
        run: node test/run.js --contract --only 資料契約 2>&1 | tee /tmp/contract.log

      - name: 執行監控
        id: monitor
        env:
          CONTRACT_FAILED: ${{ steps.contract.outcome == 'failure' && '1' || '0' }}
          CONTRACT_LOG: /tmp/contract.log
        run: node monitor/check.js ${{ inputs.drill && '--drill' || '' }}

      - name: 讀取結果
        id: result
        run: |
          echo "alerts=$(jq '.alerts | length' monitor/result.json)" >> "$GITHUB_OUTPUT"
          echo "first=$(jq -r '.firstRun' monitor/result.json)" >> "$GITHUB_OUTPUT"

      - name: 發出通知
        if: steps.result.outputs.alerts != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COUNT=$(jq '.alerts | length' monitor/result.json)
          # 以最高優先的那則作為標題
          TITLE=$(jq -r '.alerts[0].title' monitor/result.json)
          DATE=$(jq -r '.at' monitor/result.json)

          {
            jq -r '.alerts[] | "## " + .title + "\n\n" + .detail + "\n"' monitor/result.json
            echo "---"
            echo ""
            echo "### 目前市場狀態"
            echo ""
            jq -r '.state | to_entries[] | "- **" + .key + "**: " + (.value|tostring)' monitor/result.json
            echo ""
            echo "---"
            echo ""
            echo "配置台:https://marschannewtag-spec.github.io/mars-etf/"
            echo ""
            echo "> 本通知不含持倉資料。實際下單清單請開配置台執行月度檢查。"
            echo "> 自動化永不下單。"
          } > /tmp/body.md

          # 同標題的未關閉 Issue 已存在就補一則留言,不重複開
          EXISTING=$(gh issue list --label 監控 --state open \
                       --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/body.md
            echo "已於 Issue #$EXISTING 補充留言"
          else
            gh issue create --title "[$DATE] $TITLE" \
              --body-file /tmp/body.md --label 監控 || \
            gh issue create --title "[$DATE] $TITLE" --body-file /tmp/body.md
            echo "已開立新 Issue($COUNT 則警報)"
          fi

      - name: 更新心跳
        # 演練不寫心跳,避免污染下一次真實比對
        if: ${{ !inputs.drill }}
        run: |
          set -euo pipefail
          if git diff --quiet -- monitor/heartbeat.json; then
            echo "狀態未變,無需提交"
            exit 0
          fi
          git config user.name  "etf-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/heartbeat.json
          git commit -m "chore(monitor): 更新心跳 $(jq -r '.checkedAt' monitor/heartbeat.json)"
          git push
